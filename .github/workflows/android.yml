name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk serientracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: serientracker-apk
          path: serientracker.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Rolling release: one fixed download link that always holds the latest APK of each push.
      # Open https://github.com/<owner>/<repo>/releases/tag/latest-build on the phone.
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build serientracker.apk \
            --target "${GITHUB_SHA}" \
            --title "Neueste Version (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Branch: ${GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7}" \
            --prerelease
